services:
  postgres:
    image: postgres:16-alpine
    container_name: qably-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qably
      POSTGRES_PASSWORD: qably
      POSTGRES_DB: qably
    ports:
      - '5432:5432'
    volumes:
      - qably-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qably -d qably']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qably-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - qably-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qably-postgres-data:
  qably-redis-data:
